<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة الشحنات - Justobada</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap');
        body { font-family: 'Cairo', sans-serif; background-color: #f1f5f9; }
        .glass-card {
            background: white;
            border-radius: 1rem;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }
    </style>
</head>
<body class="min-h-screen text-slate-800">
    <!-- Navbar -->
    <nav class="bg-slate-900 text-white shadow-md">
        <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <i data-lucide="shield-check" class="text-green-400 w-6 h-6"></i>
                <h1 class="text-xl font-bold">لوحة تحكم الإدارة</h1>
            </div>
            <button id="logout-btn" class="bg-red-500 hover:bg-red-600 px-4 py-2 rounded font-semibold text-sm transition flex items-center gap-2">
                <i data-lucide="log-out" class="w-4 h-4"></i> خروج
            </button>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="w-full max-w-6xl mx-auto px-4 py-8 flex flex-col md:grid md:grid-cols-2 gap-8 overflow-hidden box-border">
        
        <!-- Add New Shipment Section -->
        <div class="glass-card p-6 border-t-4 border-blue-500">
            <h2 class="text-xl font-bold mb-6 flex items-center gap-2">
                <i data-lucide="package-plus" class="w-5 h-5 text-blue-500"></i> إضافة شحنة جديدة
            </h2>
            <form id="add-shipment-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-slate-600 mb-1">رقم التتبع</label>
                    <div class="flex gap-2 w-full">
                        <input type="text" id="add-tracking" required class="flex-1 w-full min-w-0 px-4 py-2 rounded-lg border focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-600 mb-1">اسم المستلم</label>
                    <input type="text" id="add-receiver" required class="w-full px-4 py-2 rounded-lg border focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-600 mb-1">الوجهة (المدينة/العنوان)</label>
                    <input type="text" id="add-destination" value="كفر الشيخ" required class="w-full px-4 py-2 rounded-lg border focus:ring-2 focus:ring-blue-500 outline-none bg-slate-100">
                </div>
                <button type="submit" id="add-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition-colors flex justify-center items-center gap-2">
                    <i data-lucide="save" class="w-4 h-4"></i> حفظ الشحنة
                </button>
                <div id="add-msg" class="text-sm font-bold text-center mt-2 hidden"></div>
            </form>
        </div>

        <!-- Update Shipment Log Section -->
        <div class="glass-card p-6 border-t-4 border-green-500">
            <h2 class="text-xl font-bold mb-6 flex items-center gap-2">
                <i data-lucide="map-pin" class="w-5 h-5 text-green-500"></i> تحديث مسار شحنة
            </h2>
            
            <!-- Search Shipment to update -->
            <div class="mb-6 flex flex-col sm:flex-row gap-2 w-full">
                <input type="text" id="search-tracking-update" placeholder="رقم التتبع..." class="flex-1 w-full min-w-0 px-4 py-2 rounded-lg border focus:ring-2 focus:ring-green-500 outline-none font-semibold text-center">
                <button type="button" id="btn-search-update" class="bg-slate-800 text-white px-4 py-2 rounded-lg hover:bg-slate-700 w-full sm:w-auto">بحث</button>
            </div>
            
            <div id="update-form-container" class="hidden opacity-50 pointer-events-none transition-opacity duration-300 w-full">
                <p class="text-sm bg-green-50 text-green-800 p-3 rounded-lg font-bold mb-4 border border-green-200 break-words" id="current-shipment-info">شحنة: ---</p>
                <input type="hidden" id="update-shipment-id">
                
                <form id="update-log-form" class="space-y-4">
                    <div>
                        <label class="block text-sm font-semibold text-slate-600 mb-1">الحالة الجديدة</label>
                        <select id="update-status" required class="w-full px-4 py-2 rounded-lg border focus:ring-2 focus:ring-green-500 outline-none font-semibold">
                            <option value="تم تجهيز الشحنة">تم تجهيز الشحنة</option>
                            <option value="في ميناء السعودية">في ميناء السعودية</option>
                            <option value="في الطريق">في الطريق</option>
                            <option value=" في ميناء مصر">في ميناء مصر</option>
                            <option value="  في جمارك مصر">وصلت جمارك مصر</option>
                            <option value="  في الطريق">في الطريق  </option>
                            <option value="وصل المستودع /">وصل المستودع</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-600 mb-1">ملاحظات (اختياري)</label>
                        <textarea id="update-notes" class="w-full min-w-0 px-4 py-2 rounded-lg border focus:ring-2 focus:ring-green-500 outline-none" rows="2"></textarea>
                    </div>
                    
                    <div class="pt-2 flex items-center gap-2">
                        <input type="checkbox" id="change-main-status" class="w-4 h-4 text-green-600" checked>
                        <label for="change-main-status" class="text-sm font-semibold text-slate-600 cursor-pointer">تحديث الحالة الرئيسية للشحنة أيضاً</label>
                    </div>

                    <button type="submit" id="update-btn" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-lg transition-colors flex justify-center items-center gap-2">
                        <i data-lucide="send" class="w-4 h-4"></i> إضافة التحديث
                    </button>
                    <div id="update-msg" class="text-sm font-bold text-center mt-2 hidden"></div>
                </form>
            </div>
        </div>

    </main>

    <script src="js/supabase-config.js"></script>
    <script src="js/admin.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
