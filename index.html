<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تتبع الشحنات - Justobada</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap');
        body { font-family: 'Cairo', sans-serif; background-color: #f8fafc; }
        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
        }
        .timeline-line {
            width: 2px;
            background: #e2e8f0;
            position: absolute;
            right: 23px; /* Adjusted to perfect center of the icon */
            top: 2rem;
            bottom: 0;
            z-index: 0;
        }
        .timeline-icon {
            z-index: 1;
        }
    </style>
</head>
<body class="min-h-screen text-slate-800">
    <!-- Navbar -->
    <nav class="bg-white shadow-sm border-b border-slate-100">
        <div class="max-w-4xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <img src="logo.jpg" alt="Justobada Logo" class="w-10 h-10 object-cover rounded shadow border border-slate-200">
                <h1 class="text-xl font-bold text-slate-800">Justobada</h1>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto px-4 py-12">
        <!-- Search Section -->
        <div class="glass-card rounded-2xl p-6 md:p-10 text-center max-w-2xl mx-auto mb-10">
            <h2 class="text-2xl md:text-3xl font-bold mb-2">تتبع شحنتك</h2>
            <p class="text-slate-500 mb-8">أدخل رقم التتبع الخاص بك لمعرفة مسار الشحنة وحالتها الحالية</p>
            
            <form id="tracking-form" class="relative">
                <input 
                    type="text" 
                    id="tracking-input"
                    placeholder="مثال: EX-12345678" 
                    class="w-full pr-4 pl-12 py-4 rounded-xl border-2 border-slate-200 focus:border-blue-500 focus:ring-4 focus:ring-blue-500/20 transition-all text-lg font-semibold text-center"
                    required
                >
                <button type="submit" class="absolute left-2 top-2 bottom-2 bg-blue-600 text-white p-3 rounded-lg hover:bg-blue-700 transition-colors flex items-center justify-center">
                    <i data-lucide="search" class="w-5 h-5"></i>
                </button>
            </form>
            <p id="search-error" class="text-red-500 mt-3 text-sm font-semibold hidden">لم يتم العثور على الشحنة. يرجى التأكد من الرقم.</p>
        </div>

        <!-- Result Section (Hidden initially) -->
        <div id="result-container" class="hidden">
            <!-- Shipment Info -->
            <div class="glass-card rounded-2xl p-6 mb-8 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                <div>
                    <p class="text-sm text-slate-500 font-semibold mb-1">رقم الشحنة</p>
                    <p id="res-tracking-number" class="text-xl font-bold text-slate-800">EX-00000000</p>
                </div>
                <div>
                    <p class="text-sm text-slate-500 font-semibold mb-1">المستلم</p>
                    <p id="res-receiver" class="text-lg font-bold text-slate-800">---</p>
                </div>
                <div>
                    <p class="text-sm text-slate-500 font-semibold mb-1">الوجهة</p>
                    <p id="res-destination" class="text-lg font-bold text-slate-800">---</p>
                </div>
                <div class="bg-blue-50 px-4 py-2 rounded-lg border border-blue-100">
                    <p class="text-sm text-blue-600 font-semibold mb-1">الحالة الحالية</p>
                    <p id="res-status" class="text-lg font-bold text-blue-800">---</p>
                </div>
            </div>

            <!-- Timeline -->
            <div class="glass-card rounded-2xl p-6 md:p-8">
                <h3 class="text-lg font-bold mb-6 flex items-center gap-2">
                    <i data-lucide="clock" class="w-5 h-5 text-blue-600"></i> مسار الشحنة
                </h3>
                <div class="relative" id="timeline-container">
                    <!-- Timeline items will be injected here -->
                </div>
            </div>
        </div>
        
        <!-- Loading Spinner -->
        <div id="loading-spinner" class="hidden flex flex-col items-center justify-center py-10">
            <i data-lucide="loader-2" class="w-10 h-10 text-blue-600 animate-spin mb-4"></i>
            <p class="text-slate-500 font-semibold">جاري البحث...</p>
        </div>
    </main>

    <script src="js/supabase-config.js"></script>
    <script src="js/tracker.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
